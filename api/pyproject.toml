[tool.ruff] # provjerava sti l i očite pogreškw
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"] #E, W su pravila stila, F su pogreške poput neiskorištenog importa, I je redosljed importa

[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.ruff.lint.per-file-ignores]
# Alembic generira ove datoteke; ne uređujemo ih ručno
"migrations/env.py" = ["E402"]
"migrations/versions/*" = ["E501"]